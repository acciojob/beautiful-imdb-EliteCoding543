<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMDb Movie Page</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background-color: #111;

      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;

      min-height: 100vh;

      padding-top: 40px;
    }

    /* ================= MOVIE POSTER ================= */

    .moviePic{
      height: 450px;

      width: 320px;

      opacity: 0.9;

      border-radius: 12px;

      box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
    }

    /* ================= MOVIE DETAIL ================= */

    .movieDetail{
      position: relative;

      top: 30px;

      width: 70%;

      text-align: center;

      font-size: 20px;

      line-height: 32px;

      color: #f5f5f5;
    }

  </style>
</head>

<body>

  <!-- ================= MOVIE IMAGE ================= -->

  <img
    class="moviePic"
    src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba"
    alt="Movie Poster"
  >

  <!-- ================= MOVIE DETAIL ================= -->

  <p class="movieDetail">

    A thrilling cinematic experience that follows the journey
    of a fearless hero battling impossible odds to save the
    world. Packed with action, emotion, and unforgettable
    storytelling, this movie keeps audiences engaged from
    start to finish.

  </p>

</body>
</html>
